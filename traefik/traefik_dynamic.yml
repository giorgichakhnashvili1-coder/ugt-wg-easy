http:
  middlewares:
    basicAuth:
      basicAuth:
        users:  #admin:password123(apache md5 hash)
          - "admin:<htpasswd -nb -m admin password123>"
    compress:
      compress: {}
    hsts:
      headers:
        stsSeconds: 2592000

  routers:
    api:
      rule: "Host(`traefik.example.com`)"
      entryPoints:
        - web
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - basicAuth
      service: api@internal

tls:
  options:
    default:
      sniStrict: false
