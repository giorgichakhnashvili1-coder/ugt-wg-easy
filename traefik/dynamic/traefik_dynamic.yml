http:
  middlewares:
    basicAuth:
      basicAuth:
        users:  
          - "<YOUR_USERNAME>:<YOUR_PASSWORD_APACHE_MD5_HASH>"
    compress:
      compress: {}
    hsts:
      headers:
        stsSeconds: 2592000

  routers:
    api:
      rule: "Host(`<YOUR_DOMAIN_FOR_TRAEFIK>`)"
      entryPoints:
        - web
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - basicAuth
      service: api@internal

tls:
  options:
    default:
      sniStrict: false
